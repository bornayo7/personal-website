<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="srsTitle srsDesc">
  <title id="srsTitle">SRS App</title>
  <desc id="srsDesc">A stack of flashcards with a kanji prompt and typed answer, above a spaced-repetition stage ladder.</desc>
  <defs>
    <radialGradient id="srsGlow1" cx="0.15" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="srsGlow2" cx="0.85" cy="0.85" r="0.7">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="srsLadder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.75" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="#0d1526"/>
  <rect width="800" height="450" fill="url(#srsGlow1)"/>
  <rect width="800" height="450" fill="url(#srsGlow2)"/>

  <!-- Card stack -->
  <g transform="rotate(-6 400 185)">
    <rect x="252" y="62" width="296" height="216" rx="16" fill="#16203a" stroke="#2c3a5c" stroke-width="2"/>
  </g>
  <g transform="rotate(5 400 185)">
    <rect x="252" y="62" width="296" height="216" rx="16" fill="#1b2745" stroke="#2c3a5c" stroke-width="2"/>
  </g>
  <g>
    <rect x="250" y="66" width="300" height="216" rx="16" fill="#f7f9ff" stroke="#0b1020" stroke-width="3"/>
    <!-- deck label -->
    <rect x="272" y="88" width="92" height="24" rx="12" fill="#2563eb" opacity="0.12"/>
    <text x="318" y="105" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#2563eb">kanji · N5</text>
    <!-- AI sparkle: generated deck -->
    <path d="M516 92 L521 106 L535 111 L521 116 L516 130 L511 116 L497 111 L511 106 Z" fill="#fb923c"/>
    <!-- prompt -->
    <text x="400" y="192" text-anchor="middle" font-family="'Yu Gothic UI', 'Yu Gothic', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="76" font-weight="700" fill="#0b1020">学</text>
    <!-- typed answer -->
    <text x="352" y="246" font-family="Consolas, ui-monospace, monospace" font-size="21" fill="#2563eb">gaku</text>
    <line x1="290" y1="256" x2="462" y2="256" stroke="#0b1020" stroke-width="2.5" opacity="0.7"/>
    <circle cx="492" cy="248" r="15" fill="#34d399"/>
    <path d="M485 248 L490 254 L500 242" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- SRS stage ladder -->
  <g>
    <rect x="228" y="322" width="60" height="12" rx="6" fill="url(#srsLadder)" opacity="0.35"/>
    <rect x="298" y="322" width="60" height="12" rx="6" fill="url(#srsLadder)" opacity="0.55"/>
    <rect x="368" y="322" width="60" height="12" rx="6" fill="url(#srsLadder)" opacity="0.75"/>
    <rect x="438" y="322" width="60" height="12" rx="6" fill="url(#srsLadder)" opacity="0.9"/>
    <rect x="508" y="322" width="60" height="12" rx="6" fill="url(#srsLadder)"/>
    <text x="228" y="352" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#7286a3">apprentice</text>
    <text x="568" y="352" text-anchor="end" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#fb923c">burned</text>
  </g>

  <!-- Wordmark -->
  <text x="400" y="408" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="700"><tspan fill="#38bdf8">SRS</tspan><tspan fill="#e9eefa"> App</tspan></text>
</svg>
