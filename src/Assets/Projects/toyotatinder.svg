<svg width="640" height="400" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ToyotaTinder Swipe Deck</title>
  <desc id="desc">Abstract gradient card referencing the ToyotaTinder AI car matchmaker project.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fc5c7d" />
      <stop offset="50%" stop-color="#6a82fb" />
      <stop offset="100%" stop-color="#45c4b0" />
    </linearGradient>
  </defs>
  <rect width="640" height="400" rx="32" fill="url(#bg)" />
  <g fill="rgba(255,255,255,0.9)">
    <rect x="120" y="80" width="400" height="240" rx="28" opacity="0.25" />
    <rect x="150" y="110" width="340" height="210" rx="24" opacity="0.5" />
    <rect x="180" y="140" width="280" height="180" rx="20" />
  </g>
  <text x="200" y="210" fill="#111" font-size="32" font-family="'Segoe UI', 'Inter', sans-serif" font-weight="600">
    ToyotaTinder
  </text>
  <text x="200" y="245" fill="#222" font-size="20" font-family="'Segoe UI', 'Inter', sans-serif">
    AI Car Matchmaker
  </text>
</svg>
