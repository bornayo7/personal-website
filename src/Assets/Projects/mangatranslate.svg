<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="mtTitle mtDesc">
  <title id="mtTitle">MangaTranslate</title>
  <desc id="mtDesc">A manga panel with Japanese dialogue translated in place to English, with an arrow between the two panels.</desc>
  <defs>
    <radialGradient id="mtGlow1" cx="0.2" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mtGlow2" cx="0.85" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mtArrow" x1="346" y1="225" x2="456" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <pattern id="mtTone" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.1" fill="#0b1020" opacity="0.16"/>
      <circle cx="11" cy="11" r="2.1" fill="#0b1020" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="#0d1526"/>
  <rect width="800" height="450" fill="url(#mtGlow1)"/>
  <rect width="800" height="450" fill="url(#mtGlow2)"/>

  <!-- Left panel: original Japanese -->
  <g transform="rotate(-4 205 225)">
    <rect x="88" y="88" width="234" height="262" rx="12" fill="#f7f9ff" stroke="#0b1020" stroke-width="4"/>
    <path d="M88 100 L322 100 L322 168 L88 168 Z" fill="url(#mtTone)" opacity="0.8"/>
    <!-- speed lines -->
    <g stroke="#0b1020" stroke-width="2" opacity="0.5">
      <line x1="108" y1="322" x2="150" y2="296"/>
      <line x1="122" y1="334" x2="168" y2="306"/>
      <line x1="300" y1="330" x2="258" y2="304"/>
      <line x1="288" y1="340" x2="244" y2="314"/>
    </g>
    <ellipse cx="205" cy="200" rx="84" ry="58" fill="#ffffff" stroke="#0b1020" stroke-width="3.5"/>
    <path d="M176 250 L160 286 L204 256 Z" fill="#ffffff" stroke="#0b1020" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="176" y="246" width="58" height="10" fill="#ffffff"/>
    <text x="205" y="196" text-anchor="middle" font-family="'Yu Gothic UI', 'Yu Gothic', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="26" font-weight="700" fill="#0b1020">こんに</text>
    <text x="205" y="226" text-anchor="middle" font-family="'Yu Gothic UI', 'Yu Gothic', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="26" font-weight="700" fill="#0b1020">ちは！</text>
  </g>

  <!-- Right panel: translated overlay -->
  <g transform="rotate(4 595 225)">
    <rect x="478" y="88" width="234" height="262" rx="12" fill="#f7f9ff" stroke="#0b1020" stroke-width="4"/>
    <path d="M478 100 L712 100 L712 168 L478 168 Z" fill="url(#mtTone)" opacity="0.8"/>
    <g stroke="#0b1020" stroke-width="2" opacity="0.5">
      <line x1="498" y1="322" x2="540" y2="296"/>
      <line x1="512" y1="334" x2="558" y2="306"/>
      <line x1="690" y1="330" x2="648" y2="304"/>
      <line x1="678" y1="340" x2="634" y2="314"/>
    </g>
    <ellipse cx="595" cy="200" rx="84" ry="58" fill="#ffffff" stroke="#0b1020" stroke-width="3.5"/>
    <path d="M566 250 L550 286 L594 256 Z" fill="#ffffff" stroke="#0b1020" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="566" y="246" width="58" height="10" fill="#ffffff"/>
    <text x="595" y="212" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="800" fill="#0b1020" letter-spacing="0.5">HELLO!</text>
    <!-- subtle overlay tint marking the redrawn region -->
    <ellipse cx="595" cy="200" rx="84" ry="58" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="7 6" opacity="0.85"/>
  </g>

  <!-- Translate arrow -->
  <g>
    <path d="M346 225 L436 225" stroke="url(#mtArrow)" stroke-width="9" stroke-linecap="round"/>
    <path d="M424 202 L456 225 L424 248 Z" fill="#fb923c"/>
    <!-- AI sparkle -->
    <path d="M400 158 L406 176 L424 182 L406 188 L400 206 L394 188 L376 182 L394 176 Z" fill="#38bdf8"/>
    <circle cx="428" cy="162" r="4" fill="#fb923c"/>
  </g>

  <!-- Wordmark -->
  <text x="400" y="408" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="700"><tspan fill="#e9eefa">Manga</tspan><tspan fill="#38bdf8">Translate</tspan></text>
</svg>
