<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="jpTitle jpDesc">
  <title id="jpTitle">JobPilot</title>
  <desc id="jpDesc">A paper plane flying through open sky, towing a banner with a resume file on it.</desc>
  <defs>
    <linearGradient id="jpSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fc4f2"/>
      <stop offset="1" stop-color="#dcefFB"/>
    </linearGradient>
    <radialGradient id="jpSun" cx="0.85" cy="0.12" r="0.45">
      <stop offset="0" stop-color="#fff7d6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff7d6" stop-opacity="0"/>
    </radialGradient>
    <filter id="jpSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#4a7fae" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="800" height="450" fill="url(#jpSky)"/>
  <rect width="800" height="450" fill="url(#jpSun)"/>

  <!-- clouds -->
  <g fill="#ffffff">
    <g opacity="0.95">
      <ellipse cx="128" cy="96" rx="58" ry="22"/>
      <ellipse cx="168" cy="82" rx="42" ry="20"/>
      <ellipse cx="92" cy="84" rx="34" ry="16"/>
    </g>
    <g opacity="0.8">
      <ellipse cx="672" cy="330" rx="64" ry="24"/>
      <ellipse cx="716" cy="316" rx="44" ry="20"/>
      <ellipse cx="632" cy="318" rx="36" ry="17"/>
    </g>
    <g opacity="0.65">
      <ellipse cx="420" cy="66" rx="46" ry="16"/>
      <ellipse cx="452" cy="56" rx="30" ry="13"/>
    </g>
    <g opacity="0.5">
      <ellipse cx="96" cy="330" rx="44" ry="16"/>
      <ellipse cx="126" cy="320" rx="30" ry="13"/>
    </g>
  </g>

  <!-- flight path with loop -->
  <path d="M58 388 C140 372 180 330 216 296 C240 274 268 268 276 288 C284 308 258 320 244 306 C230 292 244 258 282 234 C318 212 366 196 420 188"
        fill="none" stroke="#3a6ea8" stroke-width="3" stroke-dasharray="1 13" stroke-linecap="round" opacity="0.8"/>

  <!-- banner tow line -->
  <line x1="512" y1="196" x2="580" y2="226" stroke="#3a6ea8" stroke-width="2"/>

  <!-- paper plane -->
  <g transform="rotate(-8 470 180)" filter="url(#jpSoft)">
    <path d="M400 196 L540 152 L468 244 Z" fill="#ffffff"/>
    <path d="M400 196 L468 212 L468 244 Z" fill="#c9dcee"/>
    <path d="M540 152 L468 212 L468 244 Z" fill="#e8f1f9"/>
    <path d="M400 196 L540 152 L468 212 Z" fill="#ffffff"/>
    <path d="M400 196 L540 152 M468 212 L540 152" stroke="#9dbdd8" stroke-width="2" fill="none"/>
  </g>

  <!-- towed banner -->
  <g filter="url(#jpSoft)">
    <path d="M580 214 L748 206 L744 252 L576 260 Z" fill="#ffffff"/>
    <path d="M580 214 L576 260 L562 250 L566 224 Z" fill="#d5e5f2"/>
  </g>
  <text x="662" y="240" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="17" font-weight="600" fill="#17456e" transform="rotate(-2 662 236)">resume.pdf</text>
  <circle cx="738" cy="222" r="9" fill="#34a56f"/>
  <path d="M734 222 L737 225 L743 218" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- wordmark -->
  <text x="400" y="416" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="32" font-weight="700"><tspan fill="#17456e">Job</tspan><tspan fill="#e8760c">Pilot</tspan></text>
</svg>
