<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="smTitle smDesc">
  <title id="smTitle">SkillMatch AI</title>
  <desc id="smDesc">A resume card and a role card connected through a match-score ring on a light dashboard background.</desc>
  <defs>
    <linearGradient id="smRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="smLink" x1="180" y1="205" x2="620" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="smShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#3b3f8a" flood-opacity="0.16"/>
    </filter>
    <radialGradient id="smTint1" cx="0.15" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="smTint2" cx="0.9" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="#f5f6fb"/>
  <rect width="800" height="450" fill="url(#smTint1)"/>
  <rect width="800" height="450" fill="url(#smTint2)"/>

  <!-- link line -->
  <line x1="180" y1="205" x2="620" y2="205" stroke="url(#smLink)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>

  <!-- candidate resume card -->
  <g filter="url(#smShadow)">
    <rect x="72" y="120" width="200" height="170" rx="14" fill="#ffffff"/>
  </g>
  <circle cx="112" cy="160" r="20" fill="#ede7fd"/>
  <circle cx="112" cy="153" r="7.5" fill="#7c3aed"/>
  <path d="M98 174 C98 164 126 164 126 174" fill="#7c3aed"/>
  <rect x="144" y="146" width="100" height="9" rx="4.5" fill="#2a2f4a"/>
  <rect x="144" y="163" width="68" height="7" rx="3.5" fill="#b9bed6"/>
  <rect x="92" y="202" width="160" height="7" rx="3.5" fill="#d9dcec"/>
  <rect x="92" y="220" width="132" height="7" rx="3.5" fill="#d9dcec"/>
  <rect x="92" y="238" width="148" height="7" rx="3.5" fill="#d9dcec"/>
  <rect x="92" y="260" width="56" height="16" rx="8" fill="#ede7fd"/>
  <rect x="156" y="260" width="56" height="16" rx="8" fill="#e3ecfd"/>

  <!-- role card -->
  <g filter="url(#smShadow)">
    <rect x="528" y="120" width="200" height="170" rx="14" fill="#ffffff"/>
  </g>
  <rect x="548" y="142" width="34" height="26" rx="5" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M558 142 L558 137 A4 4 0 0 1 562 133 L568 133 A4 4 0 0 1 572 137 L572 142" fill="none" stroke="#2563eb" stroke-width="3"/>
  <rect x="548" y="152" width="14" height="3" fill="#2563eb"/>
  <rect x="568" y="152" width="14" height="3" fill="#2563eb"/>
  <rect x="594" y="146" width="110" height="9" rx="4.5" fill="#2a2f4a"/>
  <rect x="594" y="163" width="72" height="7" rx="3.5" fill="#b9bed6"/>
  <g>
    <circle cx="556" cy="208" r="8" fill="#34a56f"/>
    <path d="M552 208 L555 211 L560 204" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="572" y="204" width="130" height="7" rx="3.5" fill="#d9dcec"/>
    <circle cx="556" cy="232" r="8" fill="#34a56f"/>
    <path d="M552 232 L555 235 L560 228" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="572" y="228" width="108" height="7" rx="3.5" fill="#d9dcec"/>
    <circle cx="556" cy="256" r="8" fill="none" stroke="#e8933c" stroke-width="2.5"/>
    <rect x="572" y="252" width="120" height="7" rx="3.5" fill="#f3ddc3"/>
  </g>

  <!-- match ring -->
  <circle cx="400" cy="205" r="70" fill="#f5f6fb"/>
  <circle cx="400" cy="205" r="62" fill="#ffffff" filter="url(#smShadow)"/>
  <circle cx="400" cy="205" r="62" fill="none" stroke="#e6e8f4" stroke-width="10"/>
  <circle cx="400" cy="205" r="62" fill="none" stroke="url(#smRing)" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="358.3 389.6" transform="rotate(-90 400 205)"/>
  <text x="400" y="205" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="700" fill="#2a2f4a">92%</text>
  <text x="400" y="230" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#8b90ad">match</text>

  <!-- floating chips -->
  <g font-family="Consolas, ui-monospace, monospace" font-size="14" text-anchor="middle">
    <rect x="306" y="78" width="82" height="28" rx="14" fill="#ffffff" stroke="#c9b8f5" stroke-width="1.5"/>
    <text x="347" y="97" fill="#6d3fd2">python</text>
    <rect x="416" y="78" width="60" height="28" rx="14" fill="#ffffff" stroke="#aec4f2" stroke-width="1.5"/>
    <text x="446" y="97" fill="#2563eb">sql</text>
    <rect x="306" y="318" width="72" height="28" rx="14" fill="#ffffff" stroke="#aec4f2" stroke-width="1.5"/>
    <text x="342" y="337" fill="#2563eb">react</text>
    <rect x="404" y="318" width="96" height="28" rx="14" fill="#ffffff" stroke="#eec79a" stroke-width="1.5"/>
    <text x="452" y="337" fill="#d97a1f">aws · gap</text>
  </g>

  <!-- wordmark -->
  <text x="400" y="410" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="700"><tspan fill="#2a2f4a">SkillMatch </tspan><tspan fill="#7c3aed">AI</tspan></text>
</svg>
