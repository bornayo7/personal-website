<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="srsTitle srsDesc">
  <title id="srsTitle">SRS App</title>
  <desc id="srsDesc">A flashcard with a kanji prompt and typed answer on washi paper, with sakura petals and a spaced-repetition stage ladder.</desc>
  <defs>
    <filter id="srsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8a7a5c" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- washi paper -->
  <rect width="800" height="450" fill="#f7f1e5"/>
  <!-- rising sun -->
  <circle cx="400" cy="200" r="158" fill="#e05545" opacity="0.1"/>

  <!-- sakura petals -->
  <g fill="#f2a8bc">
    <path d="M96 84 C104 70 118 70 122 84 C126 96 112 108 108 100 C104 108 92 96 96 84 Z" opacity="0.85"/>
    <path d="M690 66 C698 52 712 52 716 66 C720 78 706 90 702 82 C698 90 686 78 690 66 Z" opacity="0.7" transform="rotate(40 703 71)"/>
    <path d="M714 300 C722 286 736 286 740 300 C744 312 730 324 726 316 C722 324 710 312 714 300 Z" opacity="0.8" transform="rotate(-30 727 305)"/>
    <path d="M76 322 C84 308 98 308 102 322 C106 334 92 346 88 338 C84 346 72 334 76 322 Z" opacity="0.6" transform="rotate(70 89 327)"/>
    <path d="M148 208 C154 198 164 198 167 208 C170 217 160 226 157 220 C154 226 145 217 148 208 Z" opacity="0.5" transform="rotate(15 157 212)"/>
    <path d="M652 180 C658 170 668 170 671 180 C674 189 664 198 661 192 C658 198 649 189 652 180 Z" opacity="0.5" transform="rotate(-50 661 184)"/>
  </g>

  <!-- back cards -->
  <g transform="rotate(-5 400 178)">
    <rect x="254" y="66" width="292" height="212" rx="14" fill="#fffdf8" stroke="#d9cdb8" stroke-width="2"/>
  </g>
  <g transform="rotate(4 400 178)">
    <rect x="254" y="66" width="292" height="212" rx="14" fill="#fffdf8" stroke="#d9cdb8" stroke-width="2"/>
  </g>

  <!-- front card -->
  <g filter="url(#srsShadow)">
    <rect x="252" y="70" width="296" height="214" rx="14" fill="#fffefb" stroke="#3a332c" stroke-width="2.5"/>
  </g>
  <text x="278" y="104" font-family="Consolas, ui-monospace, monospace" font-size="14" font-weight="600" fill="#c24837">kanji · N5</text>
  <text x="400" y="196" text-anchor="middle" font-family="'Yu Gothic UI', 'Yu Gothic', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="84" font-weight="700" fill="#2a2420">学</text>
  <text x="352" y="248" font-family="'Yu Gothic UI', 'Yu Gothic', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="22" fill="#c24837">がく</text>
  <line x1="294" y1="258" x2="462" y2="258" stroke="#3a332c" stroke-width="2.5" opacity="0.75"/>
  <circle cx="494" cy="250" r="15" fill="#3f9e6e"/>
  <path d="M487 250 L492 256 L502 244" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- stage ladder -->
  <g>
    <rect x="230" y="322" width="58" height="12" rx="6" fill="#c24837" opacity="0.25"/>
    <rect x="298" y="322" width="58" height="12" rx="6" fill="#c24837" opacity="0.45"/>
    <rect x="366" y="322" width="58" height="12" rx="6" fill="#c24837" opacity="0.65"/>
    <rect x="434" y="322" width="58" height="12" rx="6" fill="#c24837" opacity="0.85"/>
    <rect x="502" y="322" width="58" height="12" rx="6" fill="#d4a017"/>
    <text x="230" y="352" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#8f8570">new</text>
    <text x="560" y="352" text-anchor="end" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#b3890f">burned</text>
  </g>

  <!-- wordmark with hanko seal -->
  <g>
    <text x="386" y="410" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="700" fill="#2a2420">SRS App</text>
    <rect x="466" y="386" width="30" height="30" rx="4" fill="#c24837"/>
    <text x="481" y="409" text-anchor="middle" font-family="'Yu Gothic UI', 'Yu Gothic', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="20" font-weight="700" fill="#fffefb">記</text>
  </g>
</svg>
